name: docker-pipeline

# Triggers on every push to main branch
on:
  push:
    branches:
      - main

jobs:
  build and push docker image:
    runs-on: ubuntu-latest

    steps:
        # Pull the latest code from the repository
        - name: Checkout code
          uses: actions/checkout@v2

        # Build the Docker image from the Dockerfile in the root of the repo
        - name: Build Docker image
          run: docker build -t myapp .

        # Run the container in detached mode to verify it starts successfully
        - name: Test Docker image
          run: docker run -d myapp

        # Authenticate with Azure Container Registry using GitHub secrets
        - name: Login to ACR
          uses: docker/login-action@v2
          with:
               registry: ${{ secrets.ACR_LOGIN_SERVER }}
               username: ${{ secrets.ACR_USERNAME }}
               password: ${{ secrets.ACR_PASSWORD }}

        # Tag the image with the ACR login server URL
        - name: Tag Docker image
          run: docker tag myapp ${{ secrets.ACR_LOGIN_SERVER }}/myapp:latest

        # Push the tagged image to Azure Container Registry
        - name: Push Docker image
          run: docker push ${{ secrets.ACR_LOGIN_SERVER }}/myapp:latest