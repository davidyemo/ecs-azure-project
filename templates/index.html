<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskHub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
 
    :root {
      --bg: #0d0f14;
      --surface: #161a23;
      --surface2: #1e2330;
      --border: #2a3045;
      --accent: #6c63ff;
      --accent2: #ff6584;
      --green: #43e97b;
      --yellow: #f7971e;
      --red: #ff6584;
      --text: #e8eaf6;
      --text-muted: #7b82a0;
      --font-display: 'Syne', sans-serif;
      --font-body: 'DM Sans', sans-serif;
    }
 
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-body);
      min-height: 100vh;
      overflow-x: hidden;
    }
 
    /* Ambient background */
    body::before {
      content: '';
      position: fixed;
      top: -200px;
      left: -200px;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(108,99,255,0.12) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }
    body::after {
      content: '';
      position: fixed;
      bottom: -200px;
      right: -200px;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(255,101,132,0.08) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }
 
    /* Header */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(13,15,20,0.85);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
      padding: 0 32px;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
 
    .logo-area {
      display: flex;
      align-items: center;
      gap: 12px;
    }
 
    .logo-icon {
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }
 
    .logo-text {
      font-family: var(--font-display);
      font-size: 1.4rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      background: linear-gradient(90deg, #fff, var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
 
    .header-right {
      display: flex;
      align-items: center;
      gap: 16px;
    }
 
    .dark-toggle {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 6px 14px;
      color: var(--text-muted);
      font-size: 0.8rem;
      cursor: pointer;
      font-family: var(--font-body);
      transition: all 0.2s;
    }
    .dark-toggle:hover { color: var(--text); border-color: var(--accent); }
 
    /* Main layout */
    main {
      position: relative;
      z-index: 1;
      max-width: 1100px;
      margin: 0 auto;
      padding: 40px 24px;
    }
 
    /* Stats bar */
    .stats-bar {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      margin-bottom: 36px;
      animation: fadeUp 0.5s ease both;
    }
 
    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 20px;
      position: relative;
      overflow: hidden;
      transition: transform 0.2s, border-color 0.2s;
    }
    .stat-card:hover { transform: translateY(-2px); border-color: var(--accent); }
    .stat-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
    }
    .stat-card:nth-child(1)::before { background: var(--accent); }
    .stat-card:nth-child(2)::before { background: var(--green); }
    .stat-card:nth-child(3)::before { background: var(--yellow); }
    .stat-card:nth-child(4)::before { background: var(--red); }
 
    .stat-label {
      font-size: 0.75rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }
    .stat-value {
      font-family: var(--font-display);
      font-size: 2rem;
      font-weight: 800;
      line-height: 1;
    }
 
    /* Progress bar */
    .progress-section {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 20px 24px;
      margin-bottom: 36px;
      animation: fadeUp 0.5s 0.1s ease both;
    }
    .progress-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .progress-label {
      font-size: 0.85rem;
      color: var(--text-muted);
      font-weight: 500;
    }
    .progress-pct {
      font-family: var(--font-display);
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--green);
    }
    .progress-track {
      background: var(--surface2);
      border-radius: 999px;
      height: 8px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), var(--green));
      border-radius: 999px;
      transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
      width: 0%;
    }
 
    /* Content grid */
    .content-grid {
      display: grid;
      grid-template-columns: 1fr 340px;
      gap: 24px;
      align-items: start;
    }
 
    /* Toolbar */
    .toolbar {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
      animation: fadeUp 0.5s 0.15s ease both;
    }
 
    .search-box {
      flex: 1;
      min-width: 180px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 16px;
      color: var(--text);
      font-family: var(--font-body);
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.2s;
    }
    .search-box::placeholder { color: var(--text-muted); }
    .search-box:focus { border-color: var(--accent); }
 
    .filter-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 16px;
      color: var(--text-muted);
      font-family: var(--font-body);
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }
    .filter-btn:hover, .filter-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }
 
    /* Task list */
    .task-list-header {
      font-family: var(--font-display);
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-size: 0.75rem;
      animation: fadeUp 0.5s 0.2s ease both;
    }
 
    #task-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
      animation: fadeUp 0.5s 0.25s ease both;
    }
 
    .task {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px 20px;
      display: flex;
      align-items: flex-start;
      gap: 14px;
      transition: all 0.2s;
      animation: slideIn 0.3s ease both;
    }
    .task:hover { border-color: var(--accent); transform: translateX(2px); }
 
    .task-check {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 2px solid var(--border);
      cursor: pointer;
      flex-shrink: 0;
      margin-top: 2px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      background: transparent;
    }
    .task-check:hover { border-color: var(--green); }
    .task-check.done {
      background: var(--green);
      border-color: var(--green);
    }
    .task-check.done::after { content: '✓'; color: #000; font-size: 12px; font-weight: bold; }
 
    .task-body { flex: 1; min-width: 0; }
 
    .task-title-text {
      font-weight: 500;
      font-size: 0.95rem;
      margin-bottom: 3px;
      transition: all 0.2s;
    }
    .task-title-text.completed {
      text-decoration: line-through;
      color: var(--text-muted);
    }
 
    .task-desc {
      font-size: 0.82rem;
      color: var(--text-muted);
      margin-bottom: 8px;
    }
 
    .task-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
 
    .badge {
      font-size: 0.7rem;
      padding: 2px 8px;
      border-radius: 999px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .badge-high { background: rgba(255,101,132,0.15); color: var(--red); }
    .badge-medium { background: rgba(247,151,30,0.15); color: var(--yellow); }
    .badge-low { background: rgba(67,233,123,0.15); color: var(--green); }
 
    .category-badge {
      font-size: 0.7rem;
      padding: 2px 8px;
      border-radius: 999px;
      background: rgba(108,99,255,0.15);
      color: var(--accent);
      font-weight: 500;
    }
 
    .due-date {
      font-size: 0.72rem;
      color: var(--text-muted);
    }
    .due-date.overdue { color: var(--red); }
 
    .task-actions {
      display: flex;
      gap: 6px;
      flex-shrink: 0;
    }
 
    .icon-btn {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--text-muted);
      transition: all 0.2s;
      font-size: 14px;
    }
    .icon-btn:hover { color: var(--text); border-color: var(--accent); }
    .icon-btn.delete:hover { color: var(--red); border-color: var(--red); }
 
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
    }
    .empty-icon { font-size: 48px; margin-bottom: 16px; opacity: 0.4; }
    .empty-text { font-size: 0.9rem; }
 
    /* Sidebar form */
    .sidebar {
      position: sticky;
      top: 84px;
      animation: fadeUp 0.5s 0.3s ease both;
    }
 
    .form-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
    }
 
    .form-title {
      font-family: var(--font-display);
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .form-title span { color: var(--accent); }
 
    .form-group { margin-bottom: 14px; }
 
    .form-label {
      display: block;
      font-size: 0.75rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 6px;
      font-weight: 500;
    }
 
    .form-input, .form-select {
      width: 100%;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 14px;
      color: var(--text);
      font-family: var(--font-body);
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.2s;
      appearance: none;
    }
    .form-input::placeholder { color: var(--text-muted); }
    .form-input:focus, .form-select:focus { border-color: var(--accent); }
    .form-select option { background: var(--surface2); }
 
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
 
    .submit-btn {
      width: 100%;
      background: linear-gradient(135deg, var(--accent), #8b7cf8);
      border: none;
      border-radius: 10px;
      padding: 12px;
      color: #fff;
      font-family: var(--font-display);
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      margin-top: 6px;
      transition: all 0.2s;
      letter-spacing: 0.3px;
    }
    .submit-btn:hover { transform: translateY(-1px); box-shadow: 0 8px 24px rgba(108,99,255,0.3); }
    .submit-btn:active { transform: translateY(0); }
 
    /* Light mode */
    body.light {
      --bg: #f4f5f9;
      --surface: #ffffff;
      --surface2: #f0f1f7;
      --border: #e0e2ef;
      --text: #1a1d2e;
      --text-muted: #6b6f8a;
    }
 
    /* Animations */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes slideIn {
      from { opacity: 0; transform: translateX(-10px); }
      to { opacity: 1; transform: translateX(0); }
    }
 
    /* Responsive */
    @media (max-width: 768px) {
      .content-grid { grid-template-columns: 1fr; }
      .sidebar { position: static; }
      .stats-bar { grid-template-columns: repeat(2, 1fr); }
      header { padding: 0 16px; }
      main { padding: 24px 16px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="logo-area">
      <div class="logo-icon">⚡</div>
      <span class="logo-text">TaskHub</span>
    </div>
    <div class="header-right">
      <button class="dark-toggle" onclick="toggleTheme()">☀ Light</button>
    </div>
  </header>
 
  <main>
    <!-- Stats -->
    <div class="stats-bar">
      <div class="stat-card">
        <div class="stat-label">Total Tasks</div>
        <div class="stat-value" id="stat-total">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Completed</div>
        <div class="stat-value" id="stat-done">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">In Progress</div>
        <div class="stat-value" id="stat-pending">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">High Priority</div>
        <div class="stat-value" id="stat-high">0</div>
      </div>
    </div>
 
    <!-- Progress -->
    <div class="progress-section">
      <div class="progress-header">
        <span class="progress-label">Overall Progress</span>
        <span class="progress-pct" id="progress-pct">0%</span>
      </div>
      <div class="progress-track">
        <div class="progress-fill" id="progress-fill"></div>
      </div>
    </div>
 
    <!-- Content -->
    <div class="content-grid">
      <!-- Left: Task list -->
      <div>
        <div class="toolbar">
          <input class="search-box" type="text" id="search-input" placeholder="🔍  Search tasks..." oninput="renderTasks()">
          <button class="filter-btn active" onclick="setFilter('all', this)">All</button>
          <button class="filter-btn" onclick="setFilter('active', this)">Active</button>
          <button class="filter-btn" onclick="setFilter('done', this)">Done</button>
          <button class="filter-btn" onclick="setFilter('high', this)">🔥 High</button>
        </div>
 
        <div class="task-list-header">Tasks</div>
        <div id="task-container"></div>
      </div>
 
      <!-- Right: Add task form -->
      <div class="sidebar">
        <div class="form-card">
          <div class="form-title">＋ <span>New Task</span></div>
          <form id="add-task-form" onsubmit="addTask(event)">
            <div class="form-group">
              <label class="form-label">Title</label>
              <input class="form-input" id="task-title" placeholder="What needs to be done?" required>
            </div>
            <div class="form-group">
              <label class="form-label">Description</label>
              <input class="form-input" id="task-description" placeholder="Add details...">
            </div>
            <div class="form-row">
              <div class="form-group">
                <label class="form-label">Priority</label>
                <select class="form-select" id="task-priority">
                  <option value="low">Low</option>
                  <option value="medium" selected>Medium</option>
                  <option value="high">High</option>
                </select>
              </div>
              <div class="form-group">
                <label class="form-label">Category</label>
                <select class="form-select" id="task-category">
                  <option value="">None</option>
                  <option value="Work">Work</option>
                  <option value="Personal">Personal</option>
                  <option value="Dev">Dev</option>
                  <option value="Design">Design</option>
                </select>
              </div>
            </div>
            <div class="form-group">
              <label class="form-label">Due Date</label>
              <input class="form-input" type="date" id="task-due">
            </div>
            <button class="submit-btn" type="submit">Add Task</button>
          </form>
        </div>
      </div>
    </div>
  </main>
 
  <script>
    // In-memory task store (replace fetch calls with your Flask API)
    let tasks = {};
    let currentFilter = 'all';
 
    function setFilter(filter, btn) {
      currentFilter = filter;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderTasks();
    }
 
    function toggleTheme() {
      document.body.classList.toggle('light');
      const btn = document.querySelector('.dark-toggle');
      btn.textContent = document.body.classList.contains('light') ? '🌙 Dark' : '☀ Light';
    }
 
    function updateStats() {
      const all = Object.values(tasks);
      const done = all.filter(t => t.completed).length;
      const high = all.filter(t => t.priority === 'high').length;
      document.getElementById('stat-total').textContent = all.length;
      document.getElementById('stat-done').textContent = done;
      document.getElementById('stat-pending').textContent = all.length - done;
      document.getElementById('stat-high').textContent = high;
      const pct = all.length ? Math.round((done / all.length) * 100) : 0;
      document.getElementById('progress-pct').textContent = pct + '%';
      document.getElementById('progress-fill').style.width = pct + '%';
    }
 
    function renderTasks() {
      const container = document.getElementById('task-container');
      const search = document.getElementById('search-input').value.toLowerCase();
      let list = Object.values(tasks);
 
      if (currentFilter === 'active') list = list.filter(t => !t.completed);
      else if (currentFilter === 'done') list = list.filter(t => t.completed);
      else if (currentFilter === 'high') list = list.filter(t => t.priority === 'high');
 
      if (search) list = list.filter(t =>
        t.title.toLowerCase().includes(search) ||
        (t.description || '').toLowerCase().includes(search)
      );
 
      if (!list.length) {
        container.innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">📋</div>
            <div class="empty-text">No tasks found</div>
          </div>`;
        return;
      }
 
      container.innerHTML = list.map(task => {
        const isOverdue = task.dueDate && !task.completed && new Date(task.dueDate) < new Date();
        return `
          <div class="task" id="task-${task.id}">
            <div class="task-check ${task.completed ? 'done' : ''}" onclick="toggleTask('${task.id}', ${task.completed})"></div>
            <div class="task-body">
              <div class="task-title-text ${task.completed ? 'completed' : ''}">${task.title}</div>
              ${task.description ? `<div class="task-desc">${task.description}</div>` : ''}
              <div class="task-meta">
                ${task.priority ? `<span class="badge badge-${task.priority}">${task.priority}</span>` : ''}
                ${task.category ? `<span class="category-badge">${task.category}</span>` : ''}
                ${task.dueDate ? `<span class="due-date ${isOverdue ? 'overdue' : ''}">📅 ${task.dueDate}</span>` : ''}
              </div>
            </div>
            <div class="task-actions">
              <button class="icon-btn delete" onclick="deleteTask('${task.id}')" title="Delete">✕</button>
            </div>
          </div>`;
      }).join('');
 
      updateStats();
    }
 
    function fetchTasks() {
      fetch('/tasks')
        .then(r => r.json())
        .then(data => {
          tasks = {};
          data.forEach(t => tasks[t.id] = t);
          renderTasks();
          updateStats();
        })
        .catch(() => { renderTasks(); updateStats(); });
    }
 
    function addTask(e) {
      e.preventDefault();
      const title = document.getElementById('task-title').value.trim();
      const description = document.getElementById('task-description').value.trim();
      const priority = document.getElementById('task-priority').value;
      const category = document.getElementById('task-category').value;
      const dueDate = document.getElementById('task-due').value;
 
      fetch('/tasks', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title, description, priority, category, dueDate })
      })
      .then(r => r.json())
      .then(task => {
        tasks[task.id] = task;
        document.getElementById('add-task-form').reset();
        renderTasks();
        updateStats();
      })
      .catch(() => {
        // Fallback: add locally if API unavailable
        const id = Math.random().toString(36).substr(2, 9);
        tasks[id] = { id, title, description, priority, category, dueDate, completed: false };
        document.getElementById('add-task-form').reset();
        renderTasks();
        updateStats();
      });
    }
 
    function deleteTask(id) {
      fetch(`/tasks/${id}`, { method: 'DELETE' })
        .then(() => { delete tasks[id]; renderTasks(); updateStats(); })
        .catch(() => { delete tasks[id]; renderTasks(); updateStats(); });
    }
 
    function toggleTask(id, current) {
      fetch(`/tasks/${id}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ completed: !current })
      })
      .then(r => r.json())
      .then(task => { tasks[id] = { ...tasks[id], ...task }; renderTasks(); updateStats(); })
      .catch(() => { tasks[id].completed = !current; renderTasks(); updateStats(); });
    }
 
    // Init
    fetchTasks();
  </script>
</body>
</html>
